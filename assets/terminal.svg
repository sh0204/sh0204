<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290" role="img" aria-label="Sohee Jung — Full-Stack Developer">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 18px; }
    .t { fill: #c9d1d9; }
    .p { fill: #42b883; font-weight: 700; }
    .d { fill: #58a6ff; }
    .o { fill: #8b949e; }
    .h { fill: #42b883; font-weight: 700; }
    .title { fill: #8b949e; font-size: 13px; }
  </style>
  <defs>
    <clipPath id="c1"><rect x="0" y="50" height="34" width="0"><animate attributeName="width" from="0" to="820" begin="0.4s" dur="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="114" height="34" width="0"><animate attributeName="width" from="0" to="820" begin="2s" dur="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="178" height="34" width="0"><animate attributeName="width" from="0" to="820" begin="3.6s" dur="1s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="0.5" y="0.5" width="819" height="289" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M12.5 0.5h795a12 12 0 0 1 12 12v24h-819v-24a12 12 0 0 1 12-12z" fill="#161b22"/>
  <line x1="0.5" y1="36.5" x2="819.5" y2="36.5" stroke="#30363d"/>
  <circle cx="22" cy="18.5" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18.5" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18.5" r="6" fill="#27c93f"/>
  <text x="410" y="23" text-anchor="middle" class="title">sohee@github: ~</text>

  <!-- 1 -->
  <text x="28" y="74" class="t"><tspan class="p">❯</tspan> <tspan class="d">~</tspan></text>
  <text x="80" y="74" class="t" clip-path="url(#c1)">whoami</text>
  <text x="28" y="104" class="h" opacity="0">Sohee Jung · Full-Stack Developer<set attributeName="opacity" to="1" begin="1.6s" fill="freeze"/></text>

  <!-- 2 -->
  <g opacity="0"><set attributeName="opacity" to="1" begin="1.8s" fill="freeze"/>
    <text x="28" y="138" class="t"><tspan class="p">❯</tspan> <tspan class="d">~</tspan></text>
  </g>
  <text x="80" y="138" class="t" clip-path="url(#c2)">cat stack.txt</text>
  <text x="28" y="168" class="o" opacity="0">Vue · TypeScript · JavaScript · Spring · Java<set attributeName="opacity" to="1" begin="3.2s" fill="freeze"/></text>

  <!-- 3 -->
  <g opacity="0"><set attributeName="opacity" to="1" begin="3.4s" fill="freeze"/>
    <text x="28" y="202" class="t"><tspan class="p">❯</tspan> <tspan class="d">~</tspan></text>
  </g>
  <text x="80" y="202" class="t" clip-path="url(#c3)">echo $MOTTO</text>
  <text x="28" y="232" class="o" opacity="0">"Clean code &amp; great UX, always learning."<set attributeName="opacity" to="1" begin="4.8s" fill="freeze"/></text>

  <!-- prompt + cursor -->
  <g opacity="0"><set attributeName="opacity" to="1" begin="5s" fill="freeze"/>
    <text x="28" y="266" class="t"><tspan class="p">❯</tspan> <tspan class="d">~</tspan></text>
    <rect x="80" y="251" width="10" height="20" fill="#42b883">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
